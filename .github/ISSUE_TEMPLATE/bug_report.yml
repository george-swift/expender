name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the Expender frontend
title: '🐛 [BUG]: '
labels: ['bug', 'needs-triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm you have completed these steps before submitting
      options:
        - label: I have searched for existing issues that describe this bug
          required: true
        - label: I have checked the console for JavaScript errors
          required: true
        - label: I have tested this in multiple browsers (if applicable)
          required: false

  - type: dropdown
    id: bug_type
    attributes:
      label: Bug Category
      description: What type of bug are you reporting?
      options:
        - UI/Visual Bug
        - Functionality Bug
        - Performance Issue
        - Accessibility Issue
        - Mobile/Responsive Issue
        - Authentication Issue
        - Data/API Issue
        - Other
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: A clear description of what actually happened
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser(s) are you experiencing this issue on?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - Other
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: Browser Version
      description: What version of the browser are you using?
      placeholder: e.g., Chrome 119.0.6045.105
    validations:
      required: false

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: Device Type
      description: What type of device are you using?
      options:
        - Desktop
        - Laptop
        - Tablet
        - Mobile Phone
        - Other
    validations:
      required: true

  - type: input
    id: screen_resolution
    attributes:
      label: Screen Resolution/Size
      description: What's your screen resolution or viewport size?
      placeholder: e.g., 1920x1080, iPhone 14 Pro, iPad Air
    validations:
      required: false

  - type: textarea
    id: console_errors
    attributes:
      label: Console Errors
      description: Any errors shown in the browser console (F12 -> Console tab)
      placeholder: Paste any console errors here...
      render: javascript
    validations:
      required: false

  - type: textarea
    id: network_errors
    attributes:
      label: Network Errors
      description: Any failed API calls or network errors (F12 -> Network tab)
      placeholder: Paste any network errors here...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: Add screenshots or screen recordings to help explain the problem
      placeholder: Drag and drop images/videos here or paste links...
    validations:
      required: false

  - type: checkboxes
    id: accessibility_impact
    attributes:
      label: Accessibility Impact
      description: Does this bug affect accessibility?
      options:
        - label: This bug affects keyboard navigation
        - label: This bug affects screen readers
        - label: This bug affects color contrast or visual accessibility
        - label: This bug affects focus management

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How would you rate the severity of this bug?
      options:
        - Low (Minor cosmetic issue)
        - Medium (Affects some functionality)
        - High (Breaks important features)
        - Critical (App unusable or data loss)
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any additional information that might be helpful...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help fix this issue?
      options:
        - label: I would like to work on fixing this bug
        - label: I can provide additional testing or information
